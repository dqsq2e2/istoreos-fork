name: Build iStoreOS G98

on:
  workflow_dispatch:
  push:
    branches:
      - istoreos-25.12
    paths:
      - ".github/workflows/build-g98.yml"
      - "configs/bdy-g98.config"
      - "package/**"
      - "target/linux/rockchip/**"
      - "target/linux/generic/**"

permissions:
  contents: write

concurrency:
  group: g98-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: G98 / RK3588 / Linux 6.12
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        shell: bash
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euxo pipefail
          packages=(
            build-essential clang flex bison gawk gettext git
            libncurses-dev libssl-dev libelf-dev libdw-dev
            python3 python3-setuptools python3-pip python3-pyelftools
            rsync unzip zlib1g-dev file wget curl time xsltproc
            device-tree-compiler squashfs-tools qemu-utils ccache rename
            libpython3-dev
          )
          missing=()
          for package in "${packages[@]}"; do
            if ! dpkg-query -W -f='${Status}' "$package" 2>/dev/null | grep -q 'install ok installed'; then
              missing+=("$package")
            fi
          done
          if ((${#missing[@]})); then
            # GitHub's Azure mirror is intermittently unreachable from this runner.
            # Use the archive mirror and bound every network retry.
            sudo find /etc/apt -type f \
              \( -name '*.list' -o -name '*.sources' -o -name 'apt-mirrors.txt' \) \
              -exec sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' {} +
            sudo timeout 180s apt-get \
              -o Acquire::Retries=2 \
              -o Acquire::http::Timeout=20 \
              -o Acquire::https::Timeout=20 \
              update
            sudo timeout 300s apt-get install -y --no-install-recommends "${missing[@]}"
          fi

      - name: Configure G98 target
        shell: bash
        run: |
          set -euxo pipefail
          cp configs/bdy-g98.config .config
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          make defconfig
          grep -q '^CONFIG_TARGET_rockchip_armv8_DEVICE_bdy_g98=y$' .config
          grep -q '^CONFIG_PACKAGE_uhttpd=y$' .config
          grep -q '^CONFIG_PACKAGE_uhttpd-mod-ubus=y$' .config
          grep -q '^CONFIG_DEFAULT_luci-app-store=y$' .config
          grep -q '^CONFIG_PACKAGE_u-boot-bdy-g98-rk3588-2410=y$' .config

      - name: Download sources
        run: make -j4 download

      - name: Build firmware
        run: make -j"$(nproc)" V=0

      - name: Verify G98 output
        shell: bash
        run: |
          set -euxo pipefail
          out="bin/targets/rockchip/armv8"
          test -d "$out"
          find "$out" -maxdepth 1 -type f -printf '%f %s bytes\n' | sort

          manifest=$(find "$out" -maxdepth 1 -type f -name '*.manifest' | head -n 1)
          test -n "$manifest"
          grep -q 'base-files' "$manifest"
          grep -q 'istoreos-files' "$manifest"
          grep -q 'uhttpd' "$manifest"
          grep -q 'uhttpd-mod-ubus' "$manifest"

          # The G98 U-Boot package is hidden from the rootfs manifest.  Verify
          # the two hardware-verified 2410 artifacts at their actual image
          # offsets instead of expecting a package entry that cannot exist.
          idbloader=package/boot/uboot-rockchip-g98/files/bdy-g98-istoreos-2024.10-idbloader.img
          uboot_itb=package/boot/uboot-rockchip-g98/files/BDY-G98-u-boot-2024.10-full-v21.itb
          test -f "$idbloader"
          test -f "$uboot_itb"
          idbloader_size=$(stat -c '%s' "$idbloader")
          uboot_itb_size=$(stat -c '%s' "$uboot_itb")
          idbloader_sha=$(sha256sum "$idbloader" | awk '{print $1}')
          uboot_itb_sha=$(sha256sum "$uboot_itb" | awk '{print $1}')
          test "$idbloader_sha" = aaa9f37a945e7e0d4c4f18eab68431e32c5a78ccbe49672f55c058d61e2f275d
          test "$uboot_itb_sha" = ba0380db961498ce1311c2e84bb082151c5a66fa7ed82e669d94882dbc510033
          idbloader_offset=$((64 * 512))
          uboot_itb_offset=$((16384 * 512))
          for image in "$out"/*sysupgrade.img.gz; do
            test -f "$image"
            raw=$(mktemp)
            gzip_log=$(mktemp)
            gzip_status=0
            gzip -dc -- "$image" > "$raw" 2>"$gzip_log" || gzip_status=$?
            if [ "$gzip_status" -ne 0 ]; then
              # append-metadata deliberately adds fwtool data after the gzip
              # stream, which GNU gzip reports as exit 2 after decoding it.
              test "$gzip_status" -eq 2
              grep -q 'trailing garbage ignored' "$gzip_log"
            fi
            rm -f "$gzip_log"
            embedded_idbloader_sha=$(dd if="$raw" bs=1 skip="$idbloader_offset" count="$idbloader_size" status=none | sha256sum | awk '{print $1}')
            embedded_uboot_itb_sha=$(dd if="$raw" bs=1 skip="$uboot_itb_offset" count="$uboot_itb_size" status=none | sha256sum | awk '{print $1}')
            rm -f "$raw"
            test "$embedded_idbloader_sha" = "$idbloader_sha"
            test "$embedded_uboot_itb_sha" = "$uboot_itb_sha"
          done

          grep -q 'hdmi0' target/linux/rockchip/dts/rk3588/rk3588-bdy-g98.dts
          grep -q 'lan1 lan2 lan3 lan4 lan5 lan6 lan7 lan8' \
            target/linux/rockchip/armv8/base-files/etc/board.d/02_network
          grep -q 'bdy-g98-rk3588-2410' target/linux/rockchip/image/legacy.mk

          rootfs=$(find "$out" -maxdepth 1 -type f -name '*rootfs*.squashfs' | head -n 1 || true)
          if [ -n "$rootfs" ]; then
            unsquashfs -ll "$rootfs" > /tmp/g98-rootfs.list
            grep -q 'bin/board_detect' /tmp/g98-rootfs.list
            grep -q 'bin/config_generate' /tmp/g98-rootfs.list
            grep -q 'bin/ipcalc.sh' /tmp/g98-rootfs.list
            grep -q 'etc/init.d/uhttpd' /tmp/g98-rootfs.list
            grep -q 'usr/sbin/uhttpd' /tmp/g98-rootfs.list
          fi

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: istoreos-g98-${{ github.sha }}
          path: bin/targets/rockchip/armv8/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          out=bin/targets/rockchip/armv8
          tag="g98-${GITHUB_RUN_NUMBER}"
          mapfile -d '' release_files < <(find "$out" -maxdepth 1 -type f -print0 | sort -z)
          test "${#release_files[@]}" -gt 0
          gh release create "$tag" "${release_files[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "iStoreOS G98 ${{ github.sha }}" \
            --notes "BDY G98 RK3588 iStoreOS firmware, Linux 6.12, verified U-Boot 2024.10 (2410)."
